 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIKE LEE MUSIC APP</title>
<style>
body{margin:0;background:#101020;color:white;font-family:Arial,sans-serif;text-align:center}
header{background:#191932;padding:22px;color:#ffd166}
main{padding:18px;max-width:650px;margin:auto}
input,button{box-sizing:border-box;padding:13px;margin:6px 0;border-radius:9px;border:0;width:100%;font-size:16px}
input{background:#252542;color:white;border:1px solid #555}
button{background:#ffd166;color:#17172b;font-weight:bold;cursor:pointer}
.panel{background:#191932;padding:16px;border-radius:16px;margin:16px 0}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
audio{width:100%;margin-top:12px}
.bars{height:110px;display:flex;align-items:center;justify-content:center;gap:9px}
.bars span{width:13px;height:70px;background:#ffd166;border-radius:9px;animation:equalize .7s infinite alternate}
.bars span:nth-child(2){animation-delay:.2s}
.bars span:nth-child(3){animation-delay:.4s}
.bars span:nth-child(4){animation-delay:.1s}
.bars span:nth-child(5){animation-delay:.3s}
.bars span:nth-child(6){animation-delay:.5s}
@keyframes equalize{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
small{color:#bbb}
</style>
</head>
<body>
<header>
<h1>🎵 MIKE LEE MUSIC APP</h1>
<p>Music from around the world</p>
</header>
<main>
<div class="bars">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>
<section class="panel">
<h2>▶ YouTube Music Video</h2>
<input id="yt" placeholder="Paste YouTube video URL or ID">
<button onclick="playVideo()">PLAY VIDEO</button>
<div id="video"><small>Your selected video will appear here.</small></div>
</section>
<section class="panel">
<h2>🎧 Direct Audio Player</h2>
<input id="audioUrl" placeholder="Paste direct MP3 or audio URL">
<button onclick="playAudio()">LOAD AUDIO</button>
<audio id="player" controls preload="none"></audio>
<p><small>Use a direct audio file URL, not a normal webpage link.</small></p>
</section>
</main>
<script>
function playVideo(){
 const input=document.getElementById('yt').value.trim();
 let id=input;
 try{
   const u=new URL(input);
   if(u.hostname==='youtu.be') id=u.pathname.split('/').filter(Boolean)[0]||'';
   else if(u.hostname.endsWith('youtube.com')){
     if(u.pathname==='/watch') id=u.searchParams.get('v')||'';
     else if(u.pathname.startsWith('/embed/')) id=u.pathname.split('/')[2]||'';
     else if(u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2]||'';
     else id='';
   } else id='';
 }catch(e){}
 if(!/^[A-Za-z0-9_-]{11}$/.test(id)){
   alert('Please enter a valid YouTube video URL or 11-character video ID.');
   return;
 }
 const frame=document.createElement('iframe');
 frame.title='YouTube music video';
 frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
 frame.allowFullscreen=true;
 frame.referrerPolicy='strict-origin-when-cross-origin';
 frame.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0';
 const box=document.getElementById('video');
 box.replaceChildren(frame);
}
function playAudio(){
 const url=document.getElementById('audioUrl').value.trim();
 if(!/^https?:\/\//i.test(url)){
   alert('Please enter a direct HTTP or HTTPS audio URL.');
   return;
 }
 const player=document.getElementById('player');
 player.src=url;
 player.load();
 player.play().catch(()=>alert('Tap Play on the audio player. If it fails, the audio URL may not be a playable audio file.'));
}
</script>
</body>
</html>
